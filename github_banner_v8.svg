<svg width="1460" height="420" viewBox="0 0 1460 420" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="pageBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#03030a"/>
      <stop offset="100%" stop-color="#07071a"/>
    </linearGradient>

    <linearGradient id="winBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d0d24"/>
      <stop offset="55%" stop-color="#0a0a1c"/>
      <stop offset="100%" stop-color="#08081a"/>
    </linearGradient>

    <linearGradient id="titleBg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#15152f"/>
      <stop offset="100%" stop-color="#181832"/>
    </linearGradient>

    <linearGradient id="borderGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f8cff"/>
      <stop offset="50%" stop-color="#5b8cff"/>
      <stop offset="100%" stop-color="#59e0ff"/>
    </linearGradient>

    <linearGradient id="scanGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4f8cff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#4f8cff" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#4f8cff" stop-opacity="0"/>
    </linearGradient>

    <filter id="glowSoft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="bigBlur" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="30"/>
    </filter>

    <pattern id="scanlines" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="1.2" fill="#ffffff" opacity="0.025"/>
    </pattern>

    <clipPath id="winClip">
      <rect x="16" y="16" width="1428" height="388" rx="16"/>
    </clipPath>
  </defs>

  <!-- outer page -->
  <rect width="1460" height="420" fill="url(#pageBg)"/>

  <!-- ambient glow blobs behind terminal -->
  <circle cx="120" cy="60" r="150" fill="#3d7bff" opacity="0.16" filter="url(#bigBlur)"/>
  <circle cx="1360" cy="380" r="170" fill="#4fd6ff" opacity="0.14" filter="url(#bigBlur)"/>

  <!-- glow border (slightly larger, blurred, animated pulse) -->
  <rect x="14" y="14" width="1432" height="392" rx="18" fill="none"
        stroke="url(#borderGlow)" stroke-width="3" opacity="0.55" filter="url(#glowSoft)">
    <animate attributeName="opacity" values="0.35;0.65;0.35" dur="3.2s" repeatCount="indefinite"/>
  </rect>

  <!-- terminal window -->
  <rect x="16" y="16" width="1428" height="388" rx="16" fill="url(#winBg)" stroke="#4a4a7a" stroke-width="1.25"/>

  <g clip-path="url(#winClip)">
    <!-- scanline texture -->
    <rect x="16" y="16" width="1428" height="388" fill="url(#scanlines)"/>

    <!-- title bar -->
    <rect x="16" y="16" width="1428" height="46" fill="url(#titleBg)"/>
    <line x1="16" y1="62" x2="1444" y2="62" stroke="#33335c" stroke-width="1"/>

    <circle cx="48" cy="39" r="7" fill="#ff5f56"/>
    <circle cx="72" cy="39" r="7" fill="#ffbd2e"/>
    <circle cx="96" cy="39" r="7" fill="#27c93f"/>

    <text x="730" y="44" text-anchor="middle" font-family="'JetBrains Mono', Menlo, Consolas, monospace" font-size="14" fill="#9a9ac2" letter-spacing="0.5">usman@axthtech&#8201;:&#8201;~/mani&#8201;&#8212;&#8201;zsh</text>

    <text x="1400" y="44" text-anchor="end" font-family="Menlo, Consolas, monospace" font-size="13" fill="#5c5c8a">● online</text>

    <!-- body -->
    <g font-family="'JetBrains Mono', Menlo, Consolas, monospace" font-size="22">

      <g>
        <text x="46" y="132" fill="#48e0a0">&#10148;</text>
        <text x="76" y="132" fill="#5b9dff">~/mani</text>
        <text x="172" y="132" fill="#f2f2fb">whoami</text>
        <rect x="172" y="113" width="79.8" height="25" fill="#0a0a1c">
          <animate attributeName="x" values="172;185.3;198.6;211.9;225.2;238.5;251.8;251.8" keyTimes="0;0.0083;0.0167;0.025;0.0333;0.0417;0.05;1" calcMode="discrete" dur="9s" repeatCount="indefinite"/>
        </rect>
      </g>

      <g opacity="0">
        <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.07;0.09;0.93;1" dur="9s" repeatCount="indefinite"/>
        <text x="76" y="170" fill="#c9c9ee">Usman Yousaf</text>
      </g>

      <g opacity="0">
        <animate attributeName="opacity" values="0;1;1;1;0" keyTimes="0;0.22;0.225;0.93;1" dur="9s" repeatCount="indefinite"/>
        <text x="46" y="222" fill="#48e0a0">&#10148;</text>
        <text x="76" y="222" fill="#5b9dff">~/mani</text>
        <text x="172" y="222" fill="#f2f2fb">role --current</text>
        <rect x="172" y="203" width="186.2" height="25" fill="#0a0a1c">
          <animate attributeName="x" values="172;172;185.3;198.6;211.9;225.2;238.5;251.8;265.1;278.4;291.7;305.0;318.3;331.6;344.9;358.2;358.2" keyTimes="0;0.22;0.2243;0.2286;0.2329;0.2371;0.2414;0.2457;0.25;0.2543;0.2586;0.2629;0.2671;0.2714;0.2757;0.28;1" calcMode="discrete" dur="9s" repeatCount="indefinite"/>
        </rect>
      </g>

      <g opacity="0">
        <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.29;0.31;0.93;1" dur="9s" repeatCount="indefinite"/>
        <text x="76" y="260" fill="#7db8ff">Senior AI Engineer</text>
      </g>

      <g opacity="0">
        <animate attributeName="opacity" values="0;1;1;1;0" keyTimes="0;0.48;0.485;0.93;1" dur="9s" repeatCount="indefinite"/>
        <text x="46" y="312" fill="#48e0a0">&#10148;</text>
        <text x="76" y="312" fill="#5b9dff">~/mani</text>
        <text x="172" y="312" fill="#f2f2fb">echo $STATUS</text>
        <rect x="172" y="293" width="159.6" height="25" fill="#0a0a1c">
          <animate attributeName="x" values="172;172;185.3;198.6;211.9;225.2;238.5;251.8;265.1;278.4;291.7;305.0;318.3;331.6;331.6" keyTimes="0;0.48;0.4846;0.4892;0.4938;0.4983;0.5029;0.5075;0.5121;0.5167;0.5212;0.5258;0.5304;0.535;1" calcMode="discrete" dur="9s" repeatCount="indefinite"/>
        </rect>
      </g>

      <g opacity="0">
        <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.545;0.565;0.93;1" dur="9s" repeatCount="indefinite"/>
        <text x="76" y="350" fill="#ffd580">Lazy Genius Engineer</text>
      </g>

      <g opacity="0">
        <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.7;0.72;0.93;1" dur="9s" repeatCount="indefinite"/>
        <text x="46" y="392" fill="#48e0a0">&#10148;</text>
        <text x="76" y="392" fill="#5b9dff">~/mani</text>
        <rect x="172" y="373" width="12" height="23" fill="#e6e6ff">
          <animate attributeName="opacity" values="1;0;1;0;1;0;1;0;1" keyTimes="0;0.03;0.06;0.09;0.12;0.15;0.18;0.21;0.24" dur="2.6s" repeatCount="indefinite"/>
        </rect>
      </g>
    </g>
    </g>

  <!-- inner hairline highlight for glass effect -->
  <rect x="16" y="16" width="1428" height="388" rx="16" fill="none" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1"/>
</svg>
